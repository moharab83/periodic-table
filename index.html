<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c4cf5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="جدول دوري تفاعلي بالعربي: دوس على أي عنصر يظهرلك بشكل ثلاثي الأبعاد ويعرّفك بنفسه بالمصري.">
<title>الجدول الدوري والمختبر الإلكتروني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#140f33; --bg2:#0a0820; --card:#1d1747; --brand:#6c4cf5; --brand2:#9b7bff;
    --text:#f4f1ff; --muted:#b9b0e8; --line:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #2a1f6b 0%, var(--bg1) 45%, var(--bg2) 100%) fixed;
    color:var(--text); -webkit-tap-highlight-color:transparent;
  }
  button,input,select{font-family:inherit}
  header{padding:calc(env(safe-area-inset-top) + 18px) 16px 6px;text-align:center}
  h1{font-size:1.55rem;margin:0;font-weight:800}
  .sub{color:var(--muted);margin:.35em 0 0;font-size:.95rem}
  .tools{display:flex;gap:8px;justify-content:center;align-items:center;padding:12px 14px 4px;flex-wrap:wrap}
  .search{
    flex:1;max-width:340px;min-width:180px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);
    background:rgba(255,255,255,.06);color:var(--text);font-size:1rem;outline:none
  }
  .search:focus{border-color:var(--brand2)}
  .btn{
    border:0;border-radius:12px;padding:10px 14px;font-size:.95rem;font-weight:600;cursor:pointer;
    background:rgba(255,255,255,.08);color:var(--text)
  }
  .btn.primary{background:var(--brand);color:#fff}
  .btn:active{transform:scale(.96)}
  .hint{color:var(--muted);font-size:.85rem;text-align:center;margin:6px 0 0}

  .table-wrap{overflow-x:auto;padding:12px 12px 8px;-webkit-overflow-scrolling:touch}
  .ptable{
    direction:ltr;display:grid;width:max-content;margin:0 auto;gap:3px;
    grid-template-columns:repeat(18,46px);
    grid-template-rows:repeat(7,54px) 12px repeat(2,54px);
  }
  .el{
    border:0;border-radius:9px;padding:2px 2px 3px;color:#fff;cursor:pointer;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);transition:transform .12s, opacity .2s
  }
  .el .z{position:absolute;top:2px;left:4px;font-size:9px;opacity:.85}
  .el .s{font-size:17px;font-weight:800;margin-top:6px}
  .el .n{font-size:8.5px;white-space:nowrap;overflow:hidden;max-width:43px;opacity:.95}
  .el:active{transform:scale(.9)}
  .el.dim{opacity:.15}
  .el.hit{outline:2px solid #fff;outline-offset:1px}
  .ph{border-radius:9px;border:1px dashed var(--line);color:var(--muted);font-size:9px;display:flex;align-items:center;justify-content:center;direction:ltr}

  .legend{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;padding:8px 14px calc(env(safe-area-inset-bottom) + 20px);font-size:.8rem;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

  /* ===== صفحة العنصر ===== */
  #page{
    position:fixed;inset:0;z-index:20;display:none;flex-direction:column;
    background:radial-gradient(900px 700px at 50% 30%, #2b2170 0%, #120d33 55%, #07051a 100%);
  }
  #page.open{display:flex}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 4px}
  .topbar .title{font-weight:800;font-size:1.05rem;text-align:center;flex:1}
  .stage{position:relative;flex:1;min-height:0}
  #atom{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
  #atom:active{cursor:grabbing}
  .drag-hint{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:.75rem;color:var(--muted);pointer-events:none}
  .panel{
    background:rgba(20,15,52,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border-top:1px solid var(--line);border-radius:20px 20px 0 0;
    padding:14px 16px calc(env(safe-area-inset-bottom) + 14px)
  }
  .idrow{display:flex;gap:12px;align-items:center}
  .tile{
    width:64px;height:64px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    flex:none;direction:ltr;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)
  }
  .tile b{font-size:26px;line-height:1}
  .tile small{font-size:11px;opacity:.9}
  .idtext h2{margin:0;font-size:1.35rem}
  .meta{color:var(--muted);font-size:.85rem;margin-top:2px}
  .meta .ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;white-space:nowrap}
  .bubble{
    margin-top:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;
    padding:10px 12px;font-size:1rem;line-height:1.75;max-height:28vh;overflow:auto
  }
  .bubble span{transition:background .2s,color .2s;border-radius:6px;padding:0 2px}
  .bubble span.now{background:rgba(155,123,255,.35);color:#fff}
  .actions{display:flex;gap:8px;margin-top:12px}
  .actions .btn{flex:1}
  .actions .talk{flex:2}

  /* ===== المختبر ===== */
  .labbtn{font-size:1.05rem;padding:12px 18px}
  #lab{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;
    background:radial-gradient(900px 700px at 50% 30%, #1f3a5e 0%, #0e1838 55%, #060a1c 100%)}
  #lab.open{display:flex}
  #labCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  .lab-panel{max-height:58vh;display:flex;flex-direction:column;padding-top:10px}
  .slots{display:flex;align-items:center;gap:6px}
  .slot{flex:1;min-width:0;border:2px dashed rgba(255,255,255,.25);background:rgba(255,255,255,.05);color:var(--muted);
    border-radius:12px;padding:8px 6px;font-family:inherit;font-size:.9rem;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slot.full{border-style:solid;color:#111;font-weight:800}
  .slots .plus{font-weight:800;color:var(--muted)}
  .lab-scroll{overflow:auto;margin-top:8px;flex:1;min-height:0}
  .mini{direction:ltr;display:grid;width:max-content;gap:2px;grid-template-columns:repeat(18,34px);grid-template-rows:repeat(7,36px) 8px repeat(2,36px)}
  .mini-wrap{overflow-x:auto;padding-bottom:4px}
  .mc{border:0;border-radius:6px;color:#fff;font-family:inherit;font-weight:800;font-size:13px;line-height:1;cursor:pointer;padding:0;position:relative;transition:opacity .2s}
  .mc small{position:absolute;top:1px;left:3px;font-size:7px;font-weight:600;opacity:.85}
  .mc.dim{opacity:.13}
  .mc.sel{outline:2px solid #fff;outline-offset:1px}
  .partners{font-size:.85rem;color:var(--muted);margin:2px 0 8px;line-height:1.9}
  .partners .chip{font-size:.8rem;padding:3px 8px;margin:0 2px}
  .chip{border:0;border-radius:999px;padding:5px 10px;font-weight:700;color:#111;cursor:pointer;direction:ltr;font-family:inherit;font-size:.9rem}
  .result{line-height:1.75}
  .result h3{margin:0 0 2px;font-size:1.1rem}
  .fx{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:800;color:#9fe0ff}
  .made{background:rgba(125,255,176,.08);border:1px solid rgba(125,255,176,.3);border-radius:14px;padding:8px 12px;margin-bottom:8px}
  .card{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px}
  .card .info{flex:1;min-width:0;font-size:.9rem;line-height:1.6}
  .card .need{color:var(--muted);font-size:.82rem}
  .card .btn{padding:8px 12px;white-space:nowrap}
  .card.done{border-color:rgba(125,255,176,.35)}
  .found{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:.85rem;color:var(--muted);pointer-events:none}
  .book{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:50vh;overflow:auto;margin-top:6px}
  .book div{background:rgba(255,255,255,.06);border-radius:10px;padding:6px 8px;font-size:.85rem}
  .book b{direction:ltr;unicode-bidi:isolate;display:inline-block}

  /* إعدادات الصوت */
  #settings{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
  #settings.open{display:flex}
  .sheet{
    width:100%;max-width:520px;background:var(--card);border-radius:20px 20px 0 0;
    padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)
  }
  .sheet h3{margin:0 0 10px}
  .sheet label{display:block;font-size:.9rem;color:var(--muted);margin:12px 0 6px}
  .sheet select,.sheet input[type=range]{width:100%}
  .sheet select{padding:10px;border-radius:10px;background:#120d33;color:var(--text);border:1px solid var(--line);font-size:.95rem}
  .note{font-size:.82rem;color:var(--muted);line-height:1.7;margin-top:12px;background:rgba(255,255,255,.05);border-radius:10px;padding:8px 10px}
  .warn{color:#ffcf6b}
  .sheet .row{display:flex;gap:8px;margin-top:14px}
  .sheet .row .btn{flex:1}
</style>
</head>
<body>

<header>
  <h1>⚛️ الجدول الدوري والمختبر الإلكتروني</h1>
  <p class="sub">دوس على أي عنصر، هيظهرلك بشكل ثلاثي الأبعاد ويعرّفك بنفسه 👇</p>
</header>

<div class="tools">
  <input id="q" class="search" type="search" placeholder="دوّر باسم العنصر أو رمزه أو رقمه…" aria-label="بحث عن عنصر">
  <button class="btn" id="openSettings" aria-label="إعدادات الصوت">🔊 الصوت</button>
  <button class="btn primary labbtn" id="openLab">🧪 ادخل المختبر</button>
</div>
<p class="hint">اسحب الجدول يمين وشمال لو الشاشة صغيرة</p>

<div class="table-wrap" dir="ltr"><div class="ptable" id="ptable"></div></div>
<div class="legend" id="legend"></div>

<!-- صفحة العنصر -->
<section id="page" aria-modal="true" role="dialog" aria-labelledby="elName">
  <div class="topbar">
    <button class="btn" id="back" aria-label="رجوع للجدول">→ رجوع</button>
    <div class="title" id="topTitle"></div>
    <button class="btn" id="openSettings2" aria-label="إعدادات الصوت">⚙️</button>
  </div>
  <div class="stage">
    <canvas id="atom" aria-label="نموذج ثلاثي الأبعاد للذرة"></canvas>
    <div class="drag-hint">اسحب بصباعك عشان تلفّ الذرة</div>
  </div>
  <div class="panel">
    <div class="idrow">
      <div class="tile" id="tile"></div>
      <div class="idtext">
        <h2 id="elName"></h2>
        <div class="meta" id="elMeta"></div>
      </div>
    </div>
    <div class="bubble" id="bubble" aria-live="polite"></div>
    <div class="actions">
      <button class="btn" id="prev" aria-label="العنصر اللي قبله">→ اللي قبله</button>
      <button class="btn primary talk" id="talk">🔊 اسمعني</button>
      <button class="btn" id="next" aria-label="العنصر اللي بعده">اللي بعده ←</button>
    </div>
  </div>
</section>

<!-- المختبر -->
<section id="lab" aria-modal="true" role="dialog" aria-labelledby="labTitle">
  <div class="topbar">
    <button class="btn" id="labBack" aria-label="رجوع للجدول">→ الجدول</button>
    <div class="title" id="labTitle">🧪 المختبر</div>
    <button class="btn" id="labBookBtn" aria-label="كتاب الاكتشافات">📖</button>
  </div>
  <div class="stage">
    <canvas id="labCanvas" aria-label="الكاس والمركّب ثلاثي الأبعاد"></canvas>
    <div class="found" id="foundCount"></div>
  </div>
  <div class="panel lab-panel">
    <div class="slots">
      <button class="slot" id="slotA">① اختار عنصر</button>
      <span class="plus">+</span>
      <button class="slot" id="slotB">② اختار عنصر تاني</button>
      <button class="btn" id="labClear" aria-label="ابدأ من الأول">🧹</button>
    </div>
    <div class="lab-scroll" id="labScroll">
      <div id="labResult" class="result"></div>
      <div class="mini-wrap" id="miniWrap" dir="ltr"><div class="mini" id="picker"></div></div>
    </div>
  </div>
</section>

<!-- كتاب الاكتشافات -->
<div id="bookSheet" class="settingsLike" role="dialog" aria-modal="true" style="position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)">
  <div class="sheet">
    <h3 id="bookTitle">📖 كتاب الاكتشافات</h3>
    <div class="book" id="book"></div>
    <div class="row"><button class="btn" id="bookClose">تمام</button></div>
  </div>
</div>

<!-- إعدادات الصوت -->
<div id="settings" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="sheet">
    <h3 id="setTitle">إعدادات الصوت</h3>
    <div id="humanBox" style="display:none">
      <label>الصوت البشري المصري</label>
      <div class="row" style="margin-top:0">
        <button class="btn" id="pickShakir" data-who="shakir">👨 شاكر</button>
        <button class="btn" id="pickSalma" data-who="salma">👩 سلمى</button>
      </div>
    </div>
    <label for="voiceSel">صوت الجهاز (احتياطي)</label>
    <select id="voiceSel"></select>
    <label for="rate">السرعة: <span id="rateVal"></span></label>
    <input id="rate" type="range" min="0.6" max="1.3" step="0.05">
    <div class="note" id="voiceNote"></div>
    <div class="row">
      <button class="btn primary" id="testVoice">جرّب الصوت</button>
      <button class="btn" id="closeSettings">تمام</button>
    </div>
  </div>
</div>

<noscript><p style="text-align:center">الموقع محتاج JavaScript يشتغل.</p></noscript>

/* ================= توزيع الإلكترونات على المدارات ================= */
const AUFBAU = [[1,0],[2,0],[2,1],[3,0],[3,1],[4,0],[3,2],[4,1],[5,0],[4,2],[5,1],[6,0],[4,3],[5,2],[6,1],[7,0],[5,3],[6,2],[7,1]];
const SHELL_EXCEPTIONS = {
  24:[2,8,13,1], 29:[2,8,18,1], 41:[2,8,18,12,1], 42:[2,8,18,13,1], 44:[2,8,18,15,1],
  45:[2,8,18,16,1], 46:[2,8,18,18], 47:[2,8,18,18,1], 57:[2,8,18,18,9,2], 58:[2,8,18,19,9,2],
  64:[2,8,18,25,9,2], 78:[2,8,18,32,17,1], 79:[2,8,18,32,18,1], 89:[2,8,18,32,18,9,2],
  90:[2,8,18,32,18,10,2], 91:[2,8,18,32,20,9,2], 92:[2,8,18,32,21,9,2], 93:[2,8,18,32,22,9,2],
  96:[2,8,18,32,25,9,2], 103:[2,8,18,32,32,8,3]
};
function shellsOf(z) {
  if (SHELL_EXCEPTIONS[z]) return SHELL_EXCEPTIONS[z].slice();
  const sh = []; let left = z;
  for (const [n, l] of AUFBAU) {
    if (left <= 0) break;
    const e = Math.min(2 * (2 * l + 1), left);
    sh[n - 1] = (sh[n - 1] || 0) + e; left -= e;
  }
  return Array.from(sh, x => x || 0);
}

/* ================= مكان العنصر في الجدول ================= */
function posOf(z) {
  if (z === 1) return [1, 1];
  if (z === 2) return [18, 1];
  if (z <= 10) { const i = z - 3;  return [i < 2 ? i + 1 : i + 11, 2]; }
  if (z <= 18) { const i = z - 11; return [i < 2 ? i + 1 : i + 11, 3]; }
  if (z <= 36) return [z - 18, 4];
  if (z <= 54) return [z - 36, 5];
  if (z <= 56) return [z - 54, 6];
  if (z <= 71) return [z - 57 + 4, 9];
  if (z <= 86) return [z - 72 + 4, 6];
  if (z <= 88) return [z - 86, 7];
  if (z <= 103) return [z - 89 + 4, 10];
  return [z - 104 + 4, 7];
}

const LETTERS = {
  A:"إيه", B:"بي", C:"سي", D:"دي", E:"إي", F:"إف", G:"جي", H:"إتش", I:"آي", J:"جيه",
  K:"كيه", L:"إل", M:"إم", N:"إن", O:"أو", P:"بي", Q:"كيو", R:"آر", S:"إس", T:"تي",
  U:"يو", V:"في", W:"دبليو", X:"إكس", Y:"واي", Z:"زِد"
};
const ONES = ["","واحد","اتنين","تلاتة","أربعة","خمسة","ستة","سبعة","تمانية","تسعة","عشرة"];
const TEENS = {11:"حداشر",12:"اتناشر",13:"تلاتاشر",14:"أربعتاشر",15:"خمستاشر",16:"ستاشر",17:"سبعتاشر",18:"تمنتاشر",19:"تسعتاشر"};
const TENS = {20:"عشرين",30:"تلاتين",40:"أربعين",50:"خمسين",60:"ستين",70:"سبعين",80:"تمانين",90:"تسعين"};
const HUNDREDS = {1:"مية",2:"ميتين",3:"تلتمية"};
const CONSTRUCT = {3:"تلات",4:"أربع",5:"خمس",6:"ست",7:"سبع",8:"تمن",9:"تسع",10:"عشر"};

function egyNumber(n) {
  if (n === 0) return "صفر";
  if (n >= 100) {
    const h = Math.floor(n / 100), r = n % 100;
    return HUNDREDS[h] + (r ? " و" + egyNumber(r) : "");
  }
  if (n <= 10) return ONES[n];
  if (n < 20) return TEENS[n];
  const t = Math.floor(n / 10) * 10, o = n % 10;
  return o ? ONES[o] + " و" + TENS[t] : TENS[t];
}

const NOUNS = {
  p: ["بروتون", "بروتونات", "بروتونين"],
  e: ["إلكترون", "إلكترونات", "إلكترونين"],
  o: ["مدار", "مدارات", "مدارين"]
};
function countOf(n, kind, spoken) {
  const [one, many, two] = NOUNS[kind];
  if (n === 1) return one + " واحد";
  if (n === 2) return two;
  if (n <= 10) return (spoken ? CONSTRUCT[n] : n) + " " + many;
  return (spoken ? egyNumber(n) : n) + " " + one;
}

// بيرجّع الجمل: spoken=true للنطق (أرقام بالكلام والحروف منطوقة)، false للعرض
function introSentences(el, spoken) {
  const sh = shellsOf(el.z);
  const num = x => spoken ? egyNumber(x) : String(x);
  const sym = spoken ? el.s.toUpperCase().split("").map(ch => LETTERS[ch]).join(" ") : el.s;
  const verb = el.z === 1 ? "بيلفّ" : "بيلفّوا";
  return [
    `أهلاً يا صاحبي! أنا ال${el.n}.`,
    `رمزي ${sym}، ورقمي الذرّي ${num(el.z)}.`,
    `يعني جوّه نواتي ${countOf(el.z, "p", spoken)}، وحواليّا ${countOf(el.z, "e", spoken)} ${verb} في ${countOf(sh.length, "o", spoken)}.`,
    `وزني الذرّي حوالي ${num(Math.round(el.m))}.`,
    `أنا من عيلة ${CATS[el.c].name}.`,
    FACTS[el.s] || CATS[el.c].fact
  ];
}

/* ================= الصوت ================= */
const Voice = {
  supported: typeof window !== "undefined" && "speechSynthesis" in window,
  voices: [], chosen: null, rate: 0.95, talking: false, token: 0,
  onState: () => {}, onSentence: () => {}, onSilent: () => {}, watch: 0,

  load() {
    if (!this.supported) return;
    const all = speechSynthesis.getVoices();
    const score = v => {
      let s = 0; const name = v.name.toLowerCase(), lang = v.lang.toLowerCase();
      if (lang === "ar-eg") s += 100;
      if (/salma|shakir/.test(name)) s += 50;
      if (/natural|online|neural|premium|enhanced/.test(name)) s += 20;
      if (v.localService) s += 1;
      return s;
    };
    this.voices = all.filter(v => /^ar/i.test(v.lang)).sort((a, b) => score(b) - score(a));
    let saved = null;
    try { saved = localStorage.getItem("voiceName"); const r = parseFloat(localStorage.getItem("voiceRate")); if (r) this.rate = r; } catch (e) {}
    this.chosen = this.voices.find(v => v.name === saved) || this.voices[0] || null;
  },

  speak(sentences) {
    if (!this.supported) return false;
    if (speechSynthesis.speaking || speechSynthesis.pending) this.stop();
    const my = ++this.token;
    let started = false;
    clearTimeout(this.watch);
    this.watch = setTimeout(() => { if (my === this.token && !started) this.onSilent(); }, 3000);
    sentences.forEach((text, i) => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = this.chosen ? this.chosen.lang : "ar-EG";
      if (this.chosen) u.voice = this.chosen;
      u.rate = this.rate; u.pitch = 1.08;
      u.onstart = () => { started = true; if (my !== this.token) return; this.talking = true; this.onState(true); this.onSentence(i); };
      const done = () => {
        if (my !== this.token) return;
        if (i === sentences.length - 1) { this.talking = false; this.onState(false); this.onSentence(-1); }
      };
      u.onend = done; u.onerror = done;
      speechSynthesis.speak(u);   // جملة جملة عشان كروم بيقطع الكلام الطويل
    });
    return true;
  },

  stop() {
    this.token++;
    if (this.supported) speechSynthesis.cancel();
    if (this.talking) { this.talking = false; this.onState(false); this.onSentence(-1); }
  }
};

/* ================= الصوت البشري المسجّل ================= */
// لو فيه ملفات audio/1.mp3 … audio/118.mp3 جنب الصفحة، الموقع بيشغّلها بدل صوت الجهاز
const AudioVoice = {
  available: false, have: {}, who: "shakir", talking: false, audio: null, ctx: null, analyser: null, buf: null, lv: 0, weights: [], idx: -1,
  onState: () => {}, onSentence: () => {},

  // الأصوات: audio/shakir/1.mp3 … و audio/salma/1.mp3 …
  async probe() {
    try { const w = localStorage.getItem("humanVoice"); if (w) this.who = w; } catch (e) {}
    if (typeof fetch === "undefined" || location.protocol === "file:") return false;
    for (const who of ["shakir", "salma"]) {
      try {
        const r = await fetch(`audio/${who}/1.mp3`, { method: "HEAD", cache: "no-store" });
        this.have[who] = r.ok && /audio|mpeg/.test((r.headers.get("content-type") || "").toLowerCase());
      } catch (e) { this.have[who] = false; }
    }
    if (!this.have[this.who]) this.who = this.have.shakir ? "shakir" : "salma";
    this.available = !!this.have[this.who];
    return this.available;
  },

  setWho(who) {
    if (!this.have[who]) return false;
    this.who = who; this.available = true;
    try { localStorage.setItem("humanVoice", who); } catch (e) {}
    return true;
  },

  ensureCtx() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return true; }
    try {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return false;
      this.ctx = new C();
      this.analyser = this.ctx.createAnalyser(); this.analyser.fftSize = 512;
      this.buf = new Uint8Array(this.analyser.fftSize);
      this.analyser.connect(this.ctx.destination);
      return true;
    } catch (e) { this.ctx = null; this.analyser = null; return false; }
  },
  wireAnalyser() {
    if (!this.ensureCtx() || this.mediaSrc) return;
    try { this.mediaSrc = this.ctx.createMediaElementSource(this.audio); this.mediaSrc.connect(this.analyser); } catch (e) {}
  },

  // ملف واحد فيه كذا جملة: بنشغّل الحتة المطلوبة بس
  bufs: {}, sprTok: 0, srcNode: null,
  playSprite(url, start, dur, parts) {
    this.stop();
    if (!this.ensureCtx()) { Voice.speak(parts); return; }
    const my = ++this.sprTok;
    this.parts = parts; this.talking = true; this.onState(true); this.onSentence(0);
    const go = buf => {
      if (my !== this.sprTok || !this.talking) return;
      const src = this.ctx.createBufferSource(); src.buffer = buf; src.connect(this.analyser);
      src.onended = () => { if (this.srcNode === src) { this.srcNode = null; this.finish(); } };
      this.srcNode = src; src.start(0, start, dur);
    };
    if (this.bufs[url]) return go(this.bufs[url]);
    fetch(url).then(r => { if (!r.ok) throw new Error("no file"); return r.arrayBuffer(); })
      .then(ab => new Promise((res, rej) => this.ctx.decodeAudioData(ab, res, rej)))
      .then(buf => { this.bufs[url] = buf; go(buf); })
      .catch(() => { if (my === this.sprTok && this.talking) { this.finish(); Voice.speak(parts); } });
  },

  play(el) {
    return this.playSrc(`audio/${this.who}/${el.z}.mp3`, introSentences(el, true));
  },

  playSrc(src, parts) {
    this.stop();
    if (!this.audio) {
      this.audio = new Audio(); this.audio.preload = "auto";
      this.audio.addEventListener("timeupdate", () => this.track());
      this.audio.addEventListener("ended", () => this.finish());
      this.audio.addEventListener("error", () => {
        // الملف ناقص؟ نرجع لصوت الجهاز
        if (!this.talking) return; this.finish(); Voice.speak(this.parts);
      });
    }
    this.parts = parts;
    const total = parts.reduce((a, s) => a + s.length, 0);
    let acc = 0; this.weights = parts.map(s => (acc += s.length) / total);
    this.audio.src = src;
    this.wireAnalyser();
    this.talking = true; this.idx = -1; this.onState(true); this.onSentence(0);
    const p = this.audio.play();
    if (p && p.catch) p.catch(() => { if (this.talking) { this.finish(); Voice.speak(parts); } });
    return true;
  },

  // نعلّم الجملة اللي بتتقال حسب مكاننا في الملف
  track() {
    const a = this.audio; if (!this.talking || !a.duration) return;
    const f = a.currentTime / a.duration;
    let i = this.weights.findIndex(w => f <= w); if (i < 0) i = this.weights.length - 1;
    if (i !== this.idx) { this.idx = i; this.onSentence(i); }
  },

  // مستوى الصوت عشان البُق يتحرك مع الكلام فعلًا
  level(t) {
    if (!this.analyser) return 0.5 + 0.5 * Math.sin(t * 15);
    this.analyser.getByteTimeDomainData(this.buf);
    let sum = 0; for (let i = 0; i < this.buf.length; i++) { const v = (this.buf[i] - 128) / 128; sum += v * v; }
    const target = Math.min(1, Math.sqrt(sum / this.buf.length) * 5);
    this.lv = this.lv * 0.55 + target * 0.45;
    return this.lv;
  },

  finish() { this.talking = false; this.onState(false); this.onSentence(-1); },
  stop() {
    this.sprTok++;
    if (this.srcNode) { const n = this.srcNode; this.srcNode = null; try { n.stop(); } catch (e) {} }
    if (this.audio) { this.audio.pause(); }
    if (this.talking) this.finish();
  }
};

const Speaker = {
  speak(el) { return AudioVoice.available ? AudioVoice.play(el) : Voice.speak(introSentences(el, true)); },
  stop() { AudioVoice.stop(); Voice.stop(); },
  talking() { return AudioVoice.talking || Voice.talking; }
};

/* ================= الذرة ثلاثية الأبعاد ================= */
function makeSprite(inner, outer, glow) {
  const c = document.createElement("canvas"); const S = 64; c.width = c.height = S;
  const g = c.getContext("2d");
  if (glow) {
    const gg = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
    gg.addColorStop(0, "rgba(255,255,255,1)"); gg.addColorStop(0.25, inner);
    gg.addColorStop(0.55, outer); gg.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gg; g.fillRect(0, 0, S, S);
  } else {
    const gg = g.createRadialGradient(S*0.38, S*0.34, S*0.04, S/2, S/2, S/2);
    gg.addColorStop(0, "#ffffff"); gg.addColorStop(0.18, inner); gg.addColorStop(1, outer);
    g.fillStyle = gg; g.beginPath(); g.arc(S/2, S/2, S/2 - 1, 0, Math.PI * 2); g.fill();
  }
  return c;
}

const Atom = {

    for (let i = 0; i < N; i++) {
      const y = N === 1 ? 0 : 1 - (i / (N - 1)) * 2, rr = Math.sqrt(1 - y * y), th = golden * i;
      const depth = Math.cbrt((i + 0.5) / N);
      // نوزّع البروتونات والنيوترونات بالتساوي حسب نسبتهم الحقيقية
      const type = Math.floor((i + 1) * pShare) > Math.floor(i * pShare) ? "p" : "n";
      this.nucleons.push({ x: Math.cos(th) * rr * depth, y: y * depth, z: Math.sin(th) * rr * depth, type });
    }
    if (!this.nucleons.some(n => n.type === "p")) this.nucleons[0].type = "p";

    const sh = shellsOf(el.z);
    this.orbits = sh.map((count, k) => {
      const tilt = 0.35 + k * 0.62, spin = k * 1.37;
      const nx = Math.sin(tilt) * Math.cos(spin), ny = Math.cos(tilt), nz = Math.sin(tilt) * Math.sin(spin);
      let ux = ny, uy = -nx, uz = 0; let L = Math.hypot(ux, uy, uz) || 1; ux /= L; uy /= L; uz /= L;
      const vx = ny * uz - nz * uy, vy = nz * ux - nx * uz, vz = nx * uy - ny * ux;
      return { count, u: [ux, uy, uz], v: [vx, vy, vz], speed: 1.1 / (1 + k * 0.45) * (k % 2 ? -1 : 1), r: 0 };
    });
    this.layout();
  },

  layout() {
    if (!this.el || !this.w) return;
    const maxR = Math.min(this.w, this.h) * 0.46;
    const n = this.nucleons.length;
    this.ballR = Math.max(6, Math.min(11, maxR * 0.06));
    this.nucR = this.ballR * (n === 1 ? 1 : Math.cbrt(n) * 1.05);
    const start = this.nucR + Math.max(22, maxR * 0.16);
    const step = this.orbits.length > 1 ? (maxR - start) / (this.orbits.length - 1) : 0;
    this.orbits.forEach((o, k) => { o.r = start + k * step; });
  },

  start() { if (!this.raf) { this.last = performance.now(); this.raf = requestAnimationFrame(t => this.frame(t)); } },
  stop() { cancelAnimationFrame(this.raf); this.raf = 0; },

  frame(now) {
    const dt = Math.min(0.05, (now - this.last) / 1000); this.last = now; this.t += dt;
    if (!this.dragging) { this.idle += dt; if (this.idle > 1.2) this.yaw += dt * 0.35; }
    this.draw();
    this.raf = requestAnimationFrame(t => this.frame(t));
  },

  project(x, y, z) {
    const cy = Math.cos(this.yaw), sy = Math.sin(this.yaw), cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);
    const x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
    const y2 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
    const D = Math.max(this.w, this.h) * 1.6, f = D / (D + z2);
    return { x: this.w / 2 + x1 * f, y: this.h / 2 + y2 * f, z: z2, f };
  },

  draw() {
    const g = this.ctx; if (!this.el) return;
    g.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    g.clearRect(0, 0, this.w, this.h);
    const items = [];
    const pulse = this.talking ? 1 + 0.05 * Math.sin(this.t * 14) : 1 + 0.015 * Math.sin(this.t * 2);

    // المدارات (قطع صغيرة عشان العمق يبقى صح)
    const SEG = 72;
    this.orbits.forEach(o => {
      let prev = null;
      for (let i = 0; i <= SEG; i++) {
        const a = (i / SEG) * Math.PI * 2, c = Math.cos(a) * o.r, s = Math.sin(a) * o.r;
        const p = this.project(c * o.u[0] + s * o.v[0], c * o.u[1] + s * o.v[1], c * o.u[2] + s * o.v[2]);
        if (prev) items.push({ z: (p.z + prev.z) / 2, kind: "seg", a: prev, b: p });
        prev = p;
      }
      for (let j = 0; j < o.count; j++) {
        const a = this.t * o.speed + (j / o.count) * Math.PI * 2, c = Math.cos(a) * o.r, s = Math.sin(a) * o.r;
        const p = this.project(c * o.u[0] + s * o.v[0], c * o.u[1] + s * o.v[1], c * o.u[2] + s * o.v[2]);
        items.push({ z: p.z, kind: "e", p });
      }
    });
    // النواة
    const R = this.nucR * pulse;
    this.nucleons.forEach(n => {
      const p = this.project(n.x * R, n.y * R, n.z * R);
      items.push({ z: p.z, kind: n.type, p });
    });

    items.sort((a, b) => b.z - a.z);
    const maxZ = (this.orbits.length ? this.orbits[this.orbits.length - 1].r : 50) || 50;

    // هالة النواة
    const hg = g.createRadialGradient(this.w/2, this.h/2, 0, this.w/2, this.h/2, R * 3);
    hg.addColorStop(0, "rgba(255,120,150,.35)"); hg.addColorStop(1, "rgba(255,120,150,0)");
    g.fillStyle = hg; g.beginPath(); g.arc(this.w/2, this.h/2, R * 3, 0, Math.PI * 2); g.fill();

    g.lineWidth = 1.4;
    for (const it of items) {
      if (it.kind === "seg") {
        const depth = 0.5 - it.z / (2 * maxZ);   // 0 بعيد → 1 قريب
        g.strokeStyle = `rgba(175,155,255,${0.12 + depth * 0.45})`;
        g.beginPath(); g.moveTo(it.a.x, it.a.y); g.lineTo(it.b.x, it.b.y); g.stroke();
      } else if (it.kind === "e") {
        const s = this.ballR * 2.6 * it.p.f;
        g.drawImage(this.sp.e, it.p.x - s / 2, it.p.y - s / 2, s, s);
      } else {
        const s = this.ballR * 2 * it.p.f;
        g.drawImage(this.sp[it.kind], it.p.x - s / 2, it.p.y - s / 2, s, s);
      }
    }
    this.drawFace(R);
  },

  // وش صغير على النواة بيتكلّم
  drawFace(R) {
    const g = this.ctx, cx = this.w / 2, cy = this.h / 2;
    const F = Math.max(R * 0.95, 20);
    if (this.t > this.blinkAt + 0.14) this.blinkAt = this.t + 2 + Math.random() * 3;
    const blinking = this.t > this.blinkAt;
    g.save();
    g.globalAlpha = 0.95;
    // عينين
    [-1, 1].forEach(side => {
      const ex = cx + side * F * 0.36, ey = cy - F * 0.18, er = F * 0.17;
      g.fillStyle = "#fff"; g.beginPath();
      if (blinking) g.ellipse(ex, ey, er, er * 0.15, 0, 0, Math.PI * 2);
      else g.arc(ex, ey, er, 0, Math.PI * 2);
      g.fill();
      if (!blinking) { g.fillStyle = "#1a1038"; g.beginPath(); g.arc(ex + er * 0.15, ey + er * 0.1, er * 0.5, 0, Math.PI * 2); g.fill(); }
    });
    // بُق
    const my = cy + F * 0.33, mw = F * 0.32;
    g.fillStyle = "#2a0f22"; g.strokeStyle = "#fff"; g.lineWidth = Math.max(2, F * 0.07); g.lineCap = "round";
    if (this.talking) {
      const lvl = AudioVoice.talking ? AudioVoice.level(this.t) : Math.abs(Math.sin(this.t * 15) * Math.sin(this.t * 6.3 + 1));
      const open = F * (0.04 + 0.2 * lvl);
      g.beginPath(); g.ellipse(cx, my, mw * 0.8, open, 0, 0, Math.PI * 2); g.fill(); g.stroke();
    } else {
      g.beginPath(); g.arc(cx, my - F * 0.12, mw, Math.PI * 0.2, Math.PI * 0.8); g.stroke();
    }
    g.restore();
  }
};

function genFact(m) {
  const X = elName(m.cat), A = elName(m.an), z = bySym[m.cat].z;
  let t;
  if (m.cat === "Xe" || m.cat === "Kr") t = `الغازات النبيلة هادية جدًا، بس الفلور النشيط قدر يخلّي ال${X} يتفاعل!`;
  else if (m.an === "O") t = `بيتكوّن لما ال${X} يتّحد مع الأكسجين.`;
  else if (m.an === "H") t = `ال${X} هنا خلّى الهيدروجين شايل شحنة سالبة، والمركّب ده بيتفاعل مع المية بسرعة.`;
  else if (["F","Cl","Br","I"].includes(m.an)) t = NM_CATIONS.has(m.cat) ? `مركّب بيتكوّن من ال${X} وال${A}.` : `ملح بيتكوّن من ال${X} وال${A}.`;
  else if (["N","P"].includes(m.an)) t = `مركّب صلب بيتكوّن من ال${X} وال${A}.`;
  else t = `مركّب من ال${X} وال${A}، وفيه مركّبات زيّه كتير موجودة في الصخور.`;
  if (z >= 84 || z === 43 || z === 61) t += ` وخلّي بالك، ال${X} مُشِع.`;

function genCompounds() {
  const out = [];
  for (const s in STATES) {
    const st = STATES[s], all = [...st.low, ...st.high], multi = new Set(all).size > 1;
    for (const [an, v, aname] of ANIONS) {
      if (an === s) continue;
      if (an === "N" && !NITRIDE.has(s)) continue;
      if (an === "P" && !PHOSPHIDE.has(s)) continue;
      if (an === "H" && !HYDRIDE.has(s)) continue;
      if (["N","Cl","Br","I"].includes(s) && an !== "O" && !(s === "I" && an === "F")) continue;
      if ((s === "Xe" || s === "Kr") && an !== "F") continue;
      if (NM_CATIONS.has(s) && ["Se","Te","H"].includes(an)) continue;
      if (NM_CATIONS.has(s) && an === "N" && s !== "Si" && s !== "B") continue;
      if (NM_CATIONS.has(s) && an === "P") continue;
      let states = [...st.low];
      if (an === "O") states = all;
      else if (an === "F") states = [...st.low, ...st.high.filter(x => x <= 4 || F_HIGH.has(s))];
      if (an === "I" || an === "Se" || an === "Te") states = states.filter(x => x <= 4);
      if (an === "S") states = states.filter(x => x <= 5);
      if (an === "Br") states = states.filter(x => x <= 5);
      for (const x of new Set(states)) {
        const g = gcd(x, v), a = v / g, b = x / g, c = {}; c[s] = a; c[an] = b;
        let n;
        if (NM_CATIONS.has(s)) {
          const pre = ["O","S","F","Cl","Br","I"].includes(an) && !(b === 1 && a > 1) ? PRE[b] + " " : "";
          n = `${pre}${aname} ال${elName(s)}`;
        } else n = `${aname} ال${elName(s)}${multi ? " " + ORD[x] : ""}`;
        const m = { c, n, f: s + sub(a) + an + sub(b), gen: true, cat: s, an, x };
        m.t = genFact(m);
        out.push(m);
      }
    }
  }
  return out;
}

const labKey = c => Object.keys(c).filter(k => c[k] > 0).sort().map(k => k + c[k]).join("");
const COMPOUNDS = (() => {
  const map = new Map();
  genCompounds().forEach(m => { m.key = labKey(m.c); map.set(m.key, m); });
  LAB.forEach(m => {
    m.key = labKey(m.c);
    const g = map.get(m.key);
    if (g && g.n !== m.n) m.n2 = g.n;
    map.set(m.key, m);
  });
  return [...map.values()];
})();
const LAB_BY_KEY = Object.fromEntries(COMPOUNDS.map(m => [m.key, m]));

function atomCount(n, sym) {
  const name = elName(sym);
  if (n === 1) return `ذرة ${name} واحدة`;
  if (n === 2) return `ذرتين ${name}`;
  if (n <= 10) return `${CONSTRUCT[n]} ذرات ${name}`;
  return `${egyNumber(n)} ذرة ${name}`;
}
function atomsPhrase(c, joiner) {
  const parts = Object.keys(c).map(k => atomCount(c[k], k));
  if (joiner) return parts.join(joiner);
  return parts.length > 1 ? parts.slice(0, -1).join("، ") + " و" + parts[parts.length - 1] : parts[0];
}
function labSentences(m) {
  if (m.gen) return ["تفاعل ناجح!", `عملنا ${m.n}.`];
  return ["تفاعل ناجح!", `${atomsPhrase(m.c)} اتّحدوا مع بعض وعملوا ${m.n}.`, m.t];
}

// ألوان وأحجام كل العناصر
const colorOf = s => (LAB_ELEMENTS[s] || {}).c || CATS[bySym[s].c].color;
function radiusOf(s) {
  if (LAB_ELEMENTS[s]) return LAB_ELEMENTS[s].r;

  return z <= 2 ? .55 : z <= 10 ? .8 : z <= 18 ? 1 : z <= 36 ? 1.05 : z <= 54 ? 1.1 : 1.15;

// شكل المركّب لو مالوش شكل مرسوم: روابط حسب التكافؤ وبعدين ترتيب ثلاثي الأبعاد بالقوى
function buildAuto(m) {
  const keys = Object.keys(m.c), atoms = [], bm = new Map();
  const addB = (i, j, o) => { const k = Math.min(i, j) + "-" + Math.max(i, j); bm.set(k, (bm.get(k) || 0) + o); };
  if (keys.length === 1) {
    const s = keys[0], n = m.c[s];
    for (let i = 0; i < n; i++) atoms.push(s);
    if (n === 2) addB(0, 1, Math.min(3, VAL[s] || 1));
    else if (n === 3) { addB(0, 1, 2); addB(1, 2, 1); }
    else if (n === 4) { for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++) addB(i, j, 1); }
    else for (let i = 0; i < n; i++) addB(i, (i + 1) % n, 1);
  } else {
    let [A, B] = keys.slice().sort((x, y) => m.c[x] - m.c[y] || (VAL[y] || 0) - (VAL[x] || 0));
    if (m.gen) { A = m.cat; B = m.an; }
    const a = m.c[A], b = m.c[B], ionic = m.gen && !NM_CATIONS.has(A);
    for (let i = 0; i < a; i++) atoms.push(A);
    for (let j = 0; j < b; j++) atoms.push(B);
    const vB = m.gen ? ANION_V[B] : (VAL[B] || 1), used = new Array(a).fill(0);
    for (let j = 0; j < b; j++) { const i = j % a; addB(i, a + j, ionic ? 1 : vB); used[i] += vB; }
    let aa = false;
    if (!ionic && !m.gen && a > 1) {
      const left = used.map(u => Math.max(0, (VAL[A] || 4) - u));
      if (a === 2) { const o = Math.min(left[0], left[1]); if (o > 0) { addB(0, 1, o); aa = true; } }
      else for (let pass = 0; pass < 3; pass++) for (let i = 0; i < a; i++) {
        const j = (i + 1) % a;
        if (left[i] > 0 && left[j] > 0) { addB(i, j, 1); left[i]--; left[j]--; aa = true; }
      }
    }
    if (a > 1 && !aa) { const br = a + b - 1; for (let i = 0; i < a; i++) if (!bm.has(Math.min(i, br) + "-" + Math.max(i, br))) addB(i, br, 1); }
    if (ionic) for (const k of bm.keys()) bm.set(k, 0);
  }
  const bonds = [...bm.entries()].map(([k, o]) => { const [i, j] = k.split("-").map(Number); return [i, j, Math.min(o, 3)]; });
  // ترتيب بالقوى
  const n = atoms.length, R = atoms.map(radiusOf), gold = Math.PI * (3 - Math.sqrt(5));
  const P = atoms.map((_, i) => { const y = n === 1 ? 0 : 1 - (i / (n - 1)) * 2, r = Math.sqrt(1 - y * y), th = gold * i; return [Math.cos(th) * r * 1.6, y * 1.6, Math.sin(th) * r * 1.6]; });
  for (let it = 0; it < 700; it++) {
    const F = P.map(() => [0, 0, 0]), step = .06 * (1 - it / 700) + .005;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const d = [P[j][0] - P[i][0], P[j][1] - P[i][1], P[j][2] - P[i][2]], L = Math.max(.2, Math.hypot(...d)), f = .9 / (L * L);
      for (let k = 0; k < 3; k++) { F[i][k] -= d[k] / L * f; F[j][k] += d[k] / L * f; }
    }
    for (const [i, j, o] of bonds) {
      const d = [P[j][0] - P[i][0], P[j][1] - P[i][1], P[j][2] - P[i][2]], L = Math.max(.01, Math.hypot(...d));
      const T0 = .5 * (R[i] + R[j]) + .55 - .08 * Math.max(0, o - 1) + (o === 0 ? .35 : 0), f = 1.2 * (L - T0);

    }
    for (let i = 0; i < n; i++) for (let k = 0; k < 3; k++) P[i][k] += Math.max(-.3, Math.min(.3, F[i][k] * step * 4));
  }
  return { a: atoms.map((s, i) => [s, ...P[i]]), b: bonds };
}

function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgb(${Math.round(r * k)},${Math.round(g * k)},${Math.round(b * k)})`;
}

const Mol = {
  canvas: null, ctx: null, w: 0, h: 0, dpr: 1, raf: 0, last: 0, t: 0,
  yaw: .5, pitch: -.3, dragging: false, lx: 0, ly: 0, idle: 0,
  parts: [], bonds: [], mode: "beaker", anim: 1, flash: 0, sprites: {},

  init(canvas) {
    this.canvas = canvas; this.ctx = canvas.getContext("2d");
    new ResizeObserver(() => this.resize()).observe(canvas);
    canvas.addEventListener("pointerdown", e => { this.dragging = true; this.lx = e.clientX; this.ly = e.clientY; canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener("pointermove", e => {
      if (!this.dragging) return;
      this.yaw += (e.clientX - this.lx) * .01;
      this.pitch = Math.max(-1.4, Math.min(1.4, this.pitch + (e.clientY - this.ly) * .01));
      this.lx = e.clientX; this.ly = e.clientY; this.idle = 0;
    });
    const end = () => { this.dragging = false; };
    canvas.addEventListener("pointerup", end); canvas.addEventListener("pointercancel", end);
  },
  sprite(s) {
    if (!this.sprites[s]) { const c = colorOf(s); this.sprites[s] = makeSprite(c, shade(c, .35)); }
    return this.sprites[s];
  },
  resize() {
    const r = this.canvas.getBoundingClientRect();
    this.dpr = Math.min(window.devicePixelRatio || 1, 2); this.w = r.width; this.h = r.height;
    this.canvas.width = Math.round(r.width * this.dpr); this.canvas.height = Math.round(r.height * this.dpr);
  },

  // الذرات بتتنطط جوّه الكاس
  setBeaker(counts) {
    const keep = this.mode === "beaker" ? this.parts : [];
    const next = [];
    Object.keys(counts).forEach(s => {
      const old = keep.filter(p => p.s === s);
      for (let i = 0; i < counts[s]; i++) {
        if (old[i]) { next.push(old[i]); continue; }
        const th = Math.random() * 6.28, ph = Math.acos(2 * Math.random() - 1), rr = 1.6 * Math.cbrt(Math.random());
        const sp = .9;
        next.push({ s, x: rr * Math.sin(ph) * Math.cos(th), y: rr * Math.cos(ph), z: rr * Math.sin(ph) * Math.sin(th),
                    vx: (Math.random() - .5) * sp * 2, vy: (Math.random() - .5) * sp * 2, vz: (Math.random() - .5) * sp * 2, pop: 0 });
      }
    });
    this.parts = next; this.bonds = []; this.mode = "beaker"; this.extent = 3.2;
  },

  react(m) {
    let atoms, bonds;
    if (m.lattice) {
      atoms = []; bonds = []; const idx = {};
      for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) for (let k = -1; k <= 1; k++) {
        idx[[i, j, k]] = atoms.length;
        atoms.push([m.lattice[(i + j + k + 3) % 2], i * 1.5, j * 1.5, k * 1.5]);
      }
      for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) for (let k = -1; k <= 1; k++) {
        if (i < 1) bonds.push([idx[[i, j, k]], idx[[i + 1, j, k]], 0]);
        if (j < 1) bonds.push([idx[[i, j, k]], idx[[i, j + 1, k]], 0]);
        if (k < 1) bonds.push([idx[[i, j, k]], idx[[i, j, k + 1]], 0]);
      }
    } else if (m.a) { atoms = m.a; bonds = m.b; }
    else { if (!m._auto) m._auto = buildAuto(m); atoms = m._auto.a; bonds = m._auto.b; }
    // مركز المركّب في النص
    const cx = atoms.reduce((a, p) => a + p[1], 0) / atoms.length, cy = atoms.reduce((a, p) => a + p[2], 0) / atoms.length, cz = atoms.reduce((a, p) => a + p[3], 0) / atoms.length;
    const pool = this.parts.slice();
    this.parts = atoms.map(([s, x, y, z]) => {
      const i = pool.findIndex(p => p.s === s), from = i >= 0 ? pool.splice(i, 1)[0] : { x: 0, y: 0, z: 0 };
      return { s, x: from.x, y: from.y, z: from.z, fx: from.x, fy: from.y, fz: from.z, tx: x - cx, ty: y - cy, tz: z - cz, pop: i >= 0 ? 0 : 1 };
    });
    this.bonds = bonds; this.mode = "mol"; this.anim = 0; this.flash = 1; this.lattice = !!m.lattice;
    this.extent = Math.max(1.5, ...this.parts.map(p => Math.hypot(p.tx, p.ty, p.tz) + radiusOf(p.s) * .5));

  start() { if (!this.raf) { this.resize(); this.last = performance.now(); this.raf = requestAnimationFrame(t => this.frame(t)); } },
  stop() { cancelAnimationFrame(this.raf); this.raf = 0; },

  frame(now) {

        const d = Math.hypot(p.x, p.y, p.z);

          p.vx -= 2 * dot * nx; p.vy -= 2 * dot * ny; p.vz -= 2 * dot * nz; p.x = nx * R; p.y = ny * R; p.z = nz * R; }
      });
    } else {

  draw() {

      this.bonds.forEach(([i, j, o]) => items.push({ z: (P[i].z + P[j].z) / 2 + .01, bond: [P[i], P[j], o], alpha }));
    }
    this.parts.forEach((p, i) => items.push({ z: P[i].z, atom: p, q: P[i] }));

    if (lab.classList.contains("open")) hideLab();
    const z = parseInt(location.hash.slice(1), 10);
    if (z >= 1 && z <= ELEMENTS.length) show(z); else if (page.classList.contains("open")) hide();
  }
  window.addEventListener("hashchange", fromHash);
  window.addEventListener("popstate", fromHash);
  document.addEventListener("keydown", e => {
    if (!page.classList.contains("open")) return;
    if (e.key === "Escape") $("back").click();
    if (e.key === "ArrowLeft" && current && current.z < ELEMENTS.length) openElement(current.z + 1, true);
    if (e.key === "ArrowRight" && current && current.z > 1) openElement(current.z - 1, true);
  });

  // إعدادات الصوت
  const settings = $("settings"), sel = $("voiceSel"), rate = $("rate");
  function fillVoices() {
    Voice.load();
    sel.innerHTML = "";
    if (!Voice.supported) {
      sel.innerHTML = `<option>مش مدعوم</option>`; sel.disabled = true;
    } else if (!Voice.voices.length) {
      sel.innerHTML = `<option>مفيش صوت عربي على الجهاز ده</option>`; sel.disabled = true;
    } else {
      sel.disabled = false;
      Voice.voices.forEach(v => {
        const o = document.createElement("option"); o.value = v.name;
        o.textContent = `${v.name} (${v.lang})${v.lang.toLowerCase() === "ar-eg" ? " ✓ مصري" : ""}`;
        if (Voice.chosen && v.name === Voice.chosen.name) o.selected = true;
        sel.appendChild(o);
      });
    }
    rate.value = Voice.rate; $("rateVal").textContent = Voice.rate.toFixed(2);
    const hasEgy = Voice.voices.some(v => v.lang.toLowerCase() === "ar-eg");
    $("humanBox").style.display = (AudioVoice.have.shakir || AudioVoice.have.salma) ? "" : "none";
    ["shakir", "salma"].forEach(w => {
      const b = $(w === "shakir" ? "pickShakir" : "pickSalma");
      b.disabled = !AudioVoice.have[w];
      b.classList.toggle("primary", AudioVoice.available && AudioVoice.who === w);
    });
    $("voiceNote").innerHTML = AudioVoice.available
      ? `🎙️ الصوت المصري شغّال ✓ اختار شاكر أو سلمى. صوت الجهاز بيستخدم بس لو ملف عنصر ناقص.`
      : !Voice.supported
      ? `<span class="warn">المتصفح ده مش بيدعم النطق. جرّب كروم أو سفاري أو إيدج.</span>`
      : !Voice.voices.length
        ? `<span class="warn">جهازك مفيهوش صوت عربي متسطّب، فالكلام هيتقري بنطق أجنبي.</span><br>على أندرويد: الإعدادات ← تحويل النص لكلام ← نزّل اللغة العربية. على آيفون: الإعدادات ← تسهيلات الاستخدام ← المحتوى المنطوق ← الأصوات ← العربية.`
        : hasEgy
          ? `فيه صوت مصري على جهازك ✓ واخترناه تلقائيًا.`
          : `مفيش صوت مصري على الجهاز ده، فالكلام المصري هيتقري بصوت عربي تاني. أحسن صوت مصري متاح ببلاش في متصفح <b>Microsoft Edge</b> على الكمبيوتر (اسمه Salma أو Shakir).`;
  }
  if (Voice.supported) { fillVoices(); speechSynthesis.onvoiceschanged = fillVoices; }
  sel.addEventListener("change", () => {
    Voice.chosen = Voice.voices.find(v => v.name === sel.value) || null;
    try { localStorage.setItem("voiceName", sel.value); } catch (e) {}
  });
  rate.addEventListener("input", () => {
    Voice.rate = parseFloat(rate.value); $("rateVal").textContent = Voice.rate.toFixed(2);
    try { localStorage.setItem("voiceRate", rate.value); } catch (e) {}
  });
  const openSet = () => { fillVoices(); settings.classList.add("open"); };
  $("openSettings").addEventListener("click", openSet);
  $("openSettings2").addEventListener("click", openSet);
  $("closeSettings").addEventListener("click", () => settings.classList.remove("open"));
  settings.addEventListener("click", e => { if (e.target === settings) settings.classList.remove("open"); });
  $("testVoice").addEventListener("click", () => Speaker.speak(ELEMENTS[25]));
  settings.addEventListener("click", e => { if (e.target === settings) Speaker.stop(); });
  $("closeSettings").addEventListener("click", () => Speaker.stop());

  ["pickShakir", "pickSalma"].forEach(id => $(id).addEventListener("click", e => {
    if (AudioVoice.setWho(e.currentTarget.dataset.who)) { fillVoices(); Speaker.speak(ELEMENTS[25]); }
  }));
  AudioVoice.probe().then(() => { if (settings.classList.contains("open")) fillVoices(); });
  fromHash();
}
</script>
</body>
</html>
